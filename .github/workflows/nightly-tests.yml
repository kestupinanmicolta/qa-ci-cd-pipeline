name: Nightly Test Execution

on:
  schedule:
    - cron: '0 2 * * *'  # Every night at 2 AM
  workflow_dispatch:  # Allow manual trigger

jobs:
  full-regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run All API Tests
        run: |
          cd karate-api-testing && ./gradlew test
          cd ../api-testing-rest-assured && mvn clean test

      - name: Run UI Tests
        run: |
          cd ../playwright-ecommerce && npm install && npx playwright install --with-deps
          npm test
          cd ../cypress-ecommerce && npm install && npm run cy:run:headless

      - name: Generate Allure Report
        run: |
          cd ../karate-api-testing
          ./gradlew allureReport

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./karate-api-testing/build/reports/allure-report
